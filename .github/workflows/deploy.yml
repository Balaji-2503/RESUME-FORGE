name: Publish site

# GitHub Pages for this repo is served from the `gh-pages` branch, which it
# configured automatically the first time that branch appeared. So this workflow
# rebuilds and republishes that branch rather than using actions/deploy-pages —
# that action only works when the Pages source is set to "GitHub Actions", which
# needs a repo-admin change GITHUB_TOKEN cannot make.
on:
  push:
    # `claude/resume-forge-oelrev` is the repository's default branch today.
    # Once this work lands on main, drop it from the list.
    branches: [main, master, claude/resume-forge-oelrev]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The build never drives a browser; skip Playwright's ~150MB download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # tsc runs as part of build, so a type error fails the deploy.
      - run: npm run build

      # Without this GitHub runs the built output through Jekyll.
      - run: touch dist/.nojekyll

      # gh-pages holds generated output only, so each publish replaces it
      # wholesale. Nothing but this job ever writes to that branch.
      - name: Publish dist to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
