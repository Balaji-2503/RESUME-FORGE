name: Deploy to GitHub Pages

# Deploys on a push to the default branch. `workflow_dispatch` lets you deploy
# any branch by hand from the Actions tab, which is how you publish before this
# work is merged into main.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow one deployment at a time; a queued run supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The deploy never drives a browser; skip Playwright's ~150MB download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # tsc runs as part of build, so a type error fails the deploy.
      - run: npm run build

      # `enablement` asks the API to create the Pages site. GITHUB_TOKEN can
      # deploy to an existing site but usually cannot create one — that needs
      # repo-admin rights — so on a repo where Pages has never been turned on
      # this step fails with "Resource not accessible by integration". Enable it
      # once under Settings → Pages → Source: GitHub Actions and every run after
      # that succeeds; the flag still helps anyone forking into an org whose
      # token does have the rights.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
