name: Deploy to GitHub Pages

# Deploys on a push to the default branch. `workflow_dispatch` lets you deploy
# any branch by hand from the Actions tab, which is how you publish before this
# work is merged into main.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow one deployment at a time; a queued run supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc runs as part of build, so a type error fails the deploy.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
